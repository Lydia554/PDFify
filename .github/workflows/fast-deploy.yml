name: Fast Deploy

on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Force rebuild without cache'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Fast Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        timeout: 60s
        command_timeout: 25m
        script: |
          set -e
          echo "🚀 Fast deploy starting..."
          
          cd ${{ secrets.SERVER_APP_PATH }}
          
          echo "📥 Fetching latest changes..."
          git fetch origin
          git reset --hard origin/main
          echo "Current commit: $(git log --oneline -1)"
          
          # Build with cache (unless no_cache is true)
          CACHE_FLAG=""
          if [ "${{ github.event.inputs.no_cache }}" = "true" ]; then
            CACHE_FLAG="--no-cache"
            echo "⚠️  Building without cache (forced)"
          else
            echo "⚡ Building with cache enabled"
          fi
          
          echo "🔨 Building Docker images..."
          /snap/bin/docker compose build $CACHE_FLAG
          BUILD_EXIT=$?
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ Docker build failed with exit code $BUILD_EXIT!"
            exit 1
          fi
          
          echo "🚀 Starting containers..."
          /snap/bin/docker compose up -d
          
          echo "⏳ Waiting for containers to stabilize..."
          sleep 10
          
          echo "📋 Container status:"
          /snap/bin/docker compose ps
          
          # Check for exited containers
          if /snap/bin/docker compose ps | grep -q "Exit"; then
            echo "❌ Some containers have exited!"
            /snap/bin/docker compose logs --tail=50
            exit 1
          fi
          
          echo "✅ Fast deploy complete!"
