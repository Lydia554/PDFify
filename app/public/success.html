<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful | PDFify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="images/Icon.png?v=2" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="images/Icon.png?v=2">
</head>
<body class="bg-gradient-to-br from-slate-950 via-gray-900 to-slate-950 min-h-screen">

  <div id="loadingOverlay" class="fixed top-0 left-0 w-full h-full bg-slate-900/80 backdrop-blur-sm z-50 hidden flex justify-center items-center">
    <div class="border-4 border-purple-300 border-l-purple-600 rounded-full w-12 h-12 animate-spin"></div>
  </div>

<header class="fixed top-0 left-0 right-0 z-50 shadow-lg bg-gradient-to-r from-slate-900 via-indigo-900 to-slate-900">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-4xl font-bold">
  <a href="https://pdfify.pro"
     class="bg-gradient-to-r from-indigo-700 via-purple-800 to-pink-700 bg-clip-text text-transparent hover:opacity-80 transition">
     PDFify
  </a>
</h1>

      <button id="mobileMenuBtn" class="md:hidden text-white text-2xl">☰</button>

      <nav id="mainNav" class="md:flex space-x-4">
        <a href="/" class="text-gray-400 hover:text-purple-400">🏠 Home</a>
        <a href="/api-guide" class="text-gray-400 hover:text-purple-400">📑API Guide</a>
        <a href="/shopify" class="text-gray-400 hover:text-purple-400">📑 Shopify</a>
        <a href="/woocommerce" class="text-gray-400 hover:text-purple-400">📑WooCommerce</a>
        <a href="/pdf-generator-demo" class="text-gray-400 hover:text-purple-400">📄 PDF Generator</a>
      </nav>
    </div>

    <nav id="mobileNav" class="hidden flex-col bg-[#0b1a2b] px-4 py-4 space-y-2 md:hidden">
      <a href="/" class="block text-gray-300 hover:text-purple-400">🏠 Home</a>
      <a href="/api-guide" class="block text-gray-300 hover:text-purple-400">📑 API Guide</a>
      <a href="/shopify" class="block text-gray-300 hover:text-purple-400">📑 Shopify</a>
      <a href="/woocommerce" class="block text-gray-300 hover:text-purple-400">📑 WooCommerce</a>
      <a href="/pdf-generator-demo" class="block text-gray-300 hover:text-purple-400">📄 PDF Generator</a>
    </nav>
  </header>

  <div class="w-full max-w-md flex items-center justify-center min-h-screen p-4 mt-20">
    <!-- Success Card -->
    <div class="bg-gradient-to-br from-emerald-900/50 via-green-900/50 to-teal-900/50 p-12 rounded-3xl shadow-2xl border-2 border-emerald-500/30 backdrop-blur-sm text-center w-full">
      <!-- Success Icon -->
      <div class="mb-8">
        <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-gradient-to-br from-emerald-400 to-green-500 shadow-lg">
          <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>
      </div>

      <!-- Heading -->
      <h1 class="text-4xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-green-400">
        Payment Successful!
      </h1>

      <!-- Message -->
      <p class="text-xl text-gray-200 mb-8">
        Thank you for your purchase. You're all set.
      </p>

      <!-- Button -->
      <a
        href="/pdf-generator-demo"
        class="inline-flex items-center gap-2 px-8 py-4 bg-gradient-to-r from-emerald-500 via-green-500 to-teal-500 text-white font-semibold rounded-xl hover:from-emerald-600 hover:via-green-600 hover:to-teal-600 transition-all duration-300 shadow-lg hover:shadow-xl hover:scale-105"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Back to PDFify Generator
      </a>
    </div>

    <!-- Additional Info -->
    <p class="text-center text-gray-500 mt-6 text-sm">
      A confirmation email has been sent to your inbox.
    </p>
  </div>

<script>
  // Mobile menu toggle
  const menuBtn = document.getElementById("mobileMenuBtn");
  const mobileNav = document.getElementById("mobileNav");

  if (menuBtn && mobileNav) {
    menuBtn.addEventListener("click", () => {
      mobileNav.classList.toggle("hidden");

      if (!mobileNav.classList.contains("hidden")) {
        mobileNav.style.display = "flex";
      } else {
        mobileNav.style.display = "none";
      }
    });
  }

  window.addEventListener("pageshow", () => {
    const loadingOverlay = document.getElementById("loadingOverlay");
    if (loadingOverlay) loadingOverlay.style.display = "none";
  });

  // Particle effect on header
  const header = document.querySelector('header');
  if (header) {
    for (let i = 0; i < 15; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.cssText = `
        position: absolute;
        width: ${Math.random() * 6 + 2}px;
        height: ${Math.random() * 6 + 2}px;
        background: rgba(139, 92, 246, ${Math.random() * 0.5 + 0.2});
        border-radius: 50%;
        left: ${Math.random() * 100}%;
        top: ${Math.random() * 100}%;
        animation: float ${Math.random() * 10 + 10}s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
      `;
      header.appendChild(particle);
    }
  }
</script>

<style>
  @keyframes float {
    0%, 100% {
      transform: translateY(0px);
    }
    50% {
      transform: translateY(-10px);
    }
  }

  /* Mobile menu styles */
  #mobileMenuBtn {
    display: none;
  }

  #mobileNav {
    display: none;
    flex-direction: column;
    gap: 0.5rem;
    background-color: rgba(11, 26, 43, 0.95);
    padding: 1rem;
    border-radius: 0 0 0.5rem 0.5rem;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
      0 2px 4px -1px rgba(0, 0, 0, 0.06);
  }

  #mobileNav a {
    display: block;
    text-align: center;
    padding: 0.75rem;
    font-size: 0.95rem;
    color: #ddd;
    border-radius: 6px;
    transition: background 0.2s;
  }

  #mobileNav a:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #c084fc;
  }

  @media (max-width: 768px) {
    #mainNav {
      display: none;
    }

    #mobileMenuBtn {
      display: block;
      padding-bottom: 0.2rem;
    }

    #mobileNav a:hover {
      background-color: rgba(192, 132, 252, 0.1);
      border-radius: 6px;
    }
  }

  @media (min-width: 769px) {
    #mobileNav {
      display: none !important;
    }

    #mainNav {
      display: flex;
    }
  }
</style>
</body>
</html>
