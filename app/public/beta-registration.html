<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join PDFify Beta Program</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen flex flex-col items-center justify-center p-6">
  <div class="max-w-md w-full bg-gray-900 rounded-2xl shadow-lg p-8 space-y-6 border border-gray-800">
    <h1 class="text-3xl font-bold text-center text-white">🚀 Join the PDFify Beta Program</h1>
    <p class="text-center text-gray-400">Be among the first to test upcoming features and help shape the future of PDFify.</p>

    <form id="beta-form" class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-300">Name *</label>
        <input id="name" name="name" type="text" required
          class="mt-1 w-full rounded-lg bg-gray-800 border border-gray-700 text-gray-100 p-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-300">Email *</label>
        <input id="email" name="email" type="email" required
          class="mt-1 w-full rounded-lg bg-gray-800 border border-gray-700 text-gray-100 p-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div>
        <label for="company" class="block text-sm font-medium text-gray-300">Company (optional)</label>
        <input id="company" name="company" type="text"
          class="mt-1 w-full rounded-lg bg-gray-800 border border-gray-700 text-gray-100 p-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
      </div>

      <div>
        <label for="useCase" class="block text-sm font-medium text-gray-300">How do you plan to use PDFify? *</label>
        <textarea id="useCase" name="useCase" rows="3" required
          class="mt-1 w-full rounded-lg bg-gray-800 border border-gray-700 text-gray-100 p-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          placeholder="Tell us briefly about your use case..."></textarea>
      </div>

      <div>
        <label for="referral" class="block text-sm font-medium text-gray-300">How did you hear about us? *</label>
        <select id="referral" name="referral" required
          class="mt-1 w-full rounded-lg bg-gray-800 border border-gray-700 text-gray-100 p-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          <option value="">Select...</option>
          <option value="Search Engine">Search Engine</option>
          <option value="Friend or Colleague">Friend or Colleague</option>
          <option value="Social Media">Social Media</option>
          <option value="Blog / Article">Blog / Article</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition">
        Submit Registration
      </button>

      <p id="form-message" class="text-center text-sm mt-4"></p>
    </form>
  </div>

  <div id="loading-overlay"
    class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center text-white text-lg z-50">
    Submitting your registration...
  </div>

  <script>
    const form = document.getElementById("beta-form");
    const messageEl = document.getElementById("form-message");
    const overlay = document.getElementById("loading-overlay");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      messageEl.textContent = "";
      overlay.classList.remove("hidden");

      const data = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        company: form.company.value.trim(),
        useCase: form.useCase.value.trim(),
        referral: form.referral.value,
      };

      try {
        const res = await axios.post("/api/beta-registration", data);
        messageEl.textContent = res.data.message;
        messageEl.className = "text-green-400 text-center text-sm mt-4";
        form.reset();
      } catch (err) {
        const msg = err.response?.data?.error || "An error occurred. Please try again.";
        messageEl.textContent = msg;
        messageEl.className = "text-red-400 text-center text-sm mt-4";
      } finally {
        overlay.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
