<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | PDFify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="images/Icon.png?v=2" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="images/Icon.png?v=2">
</head>
<body class="bg-gradient-to-br from-slate-950 via-gray-900 to-slate-950 min-h-screen">

  <div id="loadingOverlay" class="fixed top-0 left-0 w-full h-full bg-slate-900/80 backdrop-blur-sm z-50 hidden flex justify-center items-center">
    <div class="border-4 border-purple-300 border-l-purple-600 rounded-full w-12 h-12 animate-spin"></div>
  </div>

  <div class="w-full max-w-md flex items-center justify-center min-h-screen p-4">
    <!-- Logo/Brand -->
    <div class="text-center mb-8 w-full">
      <h1 class="text-5xl font-bold mb-2">
        <a href="/" class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 bg-clip-text text-transparent hover:opacity-80 transition">
          PDFify
        </a>
      </h1>
      <p class="text-gray-400 text-lg">Sign in to your account</p>
    </div>

    <!-- Login Card -->
    <div class="bg-gradient-to-r from-indigo-900 via-purple-950 to-pink-900 p-8 rounded-3xl shadow-2xl border-2 border-purple-500/30 backdrop-blur-sm">
      <form id="loginForm" class="space-y-6">
        <!-- Email Field -->
        <div>
          <label for="email" class="block text-sm font-semibold text-white mb-2">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
            class="w-full px-4 py-3 bg-white/90 border-2 border-purple-300 rounded-xl text-gray-900 placeholder-gray-500 focus:outline-none focus:border-pink-400 focus:ring-2 focus:ring-pink-400/20 transition-all duration-300"
          />
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-semibold text-white mb-2">Password</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
              class="w-full px-4 py-3 pr-12 bg-white/90 border-2 border-purple-300 rounded-xl text-gray-900 placeholder-gray-500 focus:outline-none focus:border-pink-400 focus:ring-2 focus:ring-pink-400/20 transition-all duration-300"
            />
            <button
              type="button"
              id="togglePassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-600 hover:text-pink-500 transition-colors duration-200 p-1"
              aria-label="Toggle password visibility"
            >
              <!-- Eye Open Icon -->
              <svg id="eyeOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Eye Closed Icon -->
              <svg id="eyeClosed" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="loginButton"
          class="w-full py-3 px-6 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white font-semibold rounded-xl hover:from-blue-700 hover:via-indigo-700 hover:to-purple-700 transition-all duration-300 shadow-lg hover:shadow-xl hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 flex items-center justify-center gap-3"
        >
          <span class="btn-text">Login</span>
          <svg id="spinner" class="hidden w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
      </form>

      <!-- Result Message -->
      <div id="result" class="mt-6 text-center text-sm opacity-0 transition-opacity duration-300 rounded-xl p-3 hidden" role="status" aria-live="polite"></div>

      <!-- Register Link -->
      <div class="mt-6 text-center text-gray-200">
        <span>Don't have an account?</span>
        <a href="/user-creation.html" class="ml-2 text-pink-300 hover:text-pink-200 font-semibold transition-colors duration-200">Create User</a>
      </div>

      <!-- Forgot Password Link -->
      <div class="mt-4 text-center">
        <a href="/forgot-password.html" class="text-gray-300 hover:text-pink-300 text-sm transition-colors duration-200">Forgot Password?</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/cookie-consent.js"></script>

  <script>
    // Elements
    const result = document.getElementById("result");
    const loginButton = document.getElementById("loginButton");
    const spinner = document.getElementById("spinner");
    const btnText = document.querySelector(".btn-text");
    const eyeOpen = document.getElementById("eyeOpen");
    const eyeClosed = document.getElementById("eyeClosed");

    // Show message helper
    function showMessage(message, type = "error") {
      result.textContent = message;
      result.classList.remove("hidden", "opacity-0");
      result.classList.add("opacity-100");

      // Remove old classes
      result.classList.remove("bg-red-500/20", "text-red-200", "border-2", "border-red-400/30");
      result.classList.remove("bg-green-500/20", "text-green-200", "border-2", "border-green-400/30");

      if (type === "error") {
        result.classList.add("bg-red-500/20", "text-red-200", "border-2", "border-red-400/30");
      } else {
        result.classList.add("bg-green-500/20", "text-green-200", "border-2", "border-green-400/30");
      }

      // auto-hide after 4s
      setTimeout(() => {
        result.classList.add("opacity-0");
        setTimeout(() => result.classList.add("hidden"), 300);
      }, 4000);
    }

    // Loading state helper
    function setLoadingState(isLoading) {
      if (isLoading) {
        loginButton.disabled = true;
        spinner.classList.remove("hidden");
        btnText.textContent = "Logging in...";
      } else {
        loginButton.disabled = false;
        spinner.classList.add("hidden");
        btnText.textContent = "Login";
      }
    }

    // Toggle password visibility
    document.getElementById("togglePassword").addEventListener("click", () => {
      const passwordField = document.getElementById("password");
      if (passwordField.type === "password") {
        passwordField.type = "text";
        eyeOpen.classList.add("hidden");
        eyeClosed.classList.remove("hidden");
      } else {
        passwordField.type = "password";
        eyeOpen.classList.remove("hidden");
        eyeClosed.classList.add("hidden");
      }
    });

    // Form submit
    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      // Cookie consent check
      if (!localStorage.getItem("cookieConsent")) {
        showMessage("You must accept cookies to continue.");
        return;
      }

      // Validations
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const passwordRegex = /^(?=.*[0-9]).{8,}$/;

      if (!email || !password) {
        showMessage("Please enter both email and password.");
        return;
      }

      if (!emailRegex.test(email)) {
        showMessage("Invalid email format.");
        return;
      }

      if (!passwordRegex.test(password)) {
        showMessage("Password must be at least 8 characters long and include at least one number.");
        return;
      }

      setLoadingState(true);

      try {
        const response = await axios.post("/api/auth/login", { email, password });

        if (response.data && response.data.apiKey) {
          localStorage.setItem("apiKey", response.data.apiKey);

          if (localStorage.getItem("cookieConsent") === "true") {
            try {
              await fetch("/api/user/consent", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({ consent: true }),
              });
            } catch (err) {
              console.warn("Failed to update consent on backend:", err);
            }
          }

          showMessage("Login successful! Redirecting...", "success");
          setTimeout(() => {
            window.location.href = "/pdf-generator-demo";
          }, 1000);
        } else {
          showMessage((response.data && response.data.error) || "Invalid email or password.");
        }
      } catch (error) {
        if (error && error.response) {
          if (error.response.status === 401 || error.response.status === 403) {
            showMessage("Invalid email or password.");
          } else if (error.response.data && error.response.data.error) {
            showMessage(`Error: ${error.response.data.error}`);
          } else {
            showMessage("Login failed. Please try again.");
          }
        } else if (error && error.request) {
          showMessage("No response from server. Please check your connection.");
        } else {
          showMessage("An unexpected error occurred. Please try again.");
        }
      } finally {
        setLoadingState(false);
      }
    });

    // Mobile menu toggle
    const menuBtn = document.getElementById("mobileMenuBtn");
    const mobileNav = document.getElementById("mobileNav");

    if (menuBtn && mobileNav) {
      menuBtn.addEventListener("click", () => {
        mobileNav.classList.toggle("hidden");

        if (!mobileNav.classList.contains("hidden")) {
          mobileNav.style.display = "flex";
        } else {
          mobileNav.style.display = "none";
        }
      });
    }

    window.addEventListener("pageshow", () => {
      const loadingOverlay = document.getElementById("loadingOverlay");
      if (loadingOverlay) loadingOverlay.style.display = "none";
    });
  </script>

<style>
  /* Mobile menu styles */
  #mobileMenuBtn {
    display: none;
  }

  #mobileNav {
    display: none;
    flex-direction: column;
    gap: 0.5rem;
    background-color: rgba(11, 26, 43, 0.95);
    padding: 1rem;
    border-radius: 0 0 0.5rem 0.5rem;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
      0 2px 4px -1px rgba(0, 0, 0, 0.06);
  }

  #mobileNav a {
    display: block;
    text-align: center;
    padding: 0.75rem;
    font-size: 0.95rem;
    color: #ddd;
    border-radius: 6px;
    transition: background 0.2s;
  }

  #mobileNav a:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #c084fc;
  }

  @media (max-width: 768px) {
    #mainNav {
      display: none;
    }

    #mobileMenuBtn {
      display: block;
      padding-bottom: 0.2rem;
    }

    #mobileNav a:hover {
      background-color: rgba(192, 132, 252, 0.1);
      border-radius: 6px;
    }
  }

  @media (min-width: 769px) {
    #mobileNav {
      display: none !important;
    }

    #mainNav {
      display: flex;
    }
  }
</style>
</body>
</html>
