<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
</head>
<body>

  <div class="container">
    <h1>Login</h1>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required />

      <label for="password">Password</label>
      <div class="password-container">
        <input type="password" id="password" placeholder="Enter your password" required />
        <button type="button" id="togglePassword" class="toggle-btn">👁️</button>
      </div>

      <button type="submit" id="loginButton">
        <span class="btn-text">Login</span>
        <span class="spinner" id="spinner" aria-hidden="true"></span>
      </button>
    </form>

    <div id="result" class="result" role="status" aria-live="polite"></div>

    <div class="register-link">
      <span>Don't have an account?</span>
      <a href="/user-creation.html">Create User</a>
    </div>

    <div class="extra-links">
      <a href="/forgot-password.html">Forgot Password?</a>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/cookie-consent.js"></script>

  <script>
    // Elements
    const result = document.getElementById("result");
    const loginButton = document.getElementById("loginButton");
    const spinner = document.getElementById("spinner");
    const btnText = document.querySelector(".btn-text");

    // Show message helper
    function showMessage(message, type = "error") {
      result.innerText = message;
      result.className = `result ${type} show`;
      // auto-hide after 4s
      setTimeout(() => result.classList.remove("show"), 4000);
    }

    // Loading state helper
    function setLoadingState(isLoading) {
      if (isLoading) {
        loginButton.disabled = true;
        spinner.style.display = "inline-block";
        btnText.textContent = "Logging in...";
      } else {
        loginButton.disabled = false;
        spinner.style.display = "none";
        btnText.textContent = "Login";
      }
    }

    // Toggle password visibility
    document.getElementById("togglePassword").addEventListener("click", () => {
      const passwordField = document.getElementById("password");
      const toggleButton = document.getElementById("togglePassword");
      if (passwordField.type === "password") {
        passwordField.type = "text";
        toggleButton.textContent = "🙈";
      } else {
        passwordField.type = "password";
        toggleButton.textContent = "👁️";
      }
    });

    // Form submit
    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      // Cookie consent check
      if (!localStorage.getItem("cookieConsent")) {
        showMessage("You must accept cookies to continue.");
        return;
      }

      // Validations
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const passwordRegex = /^(?=.*[0-9]).{8,}$/;

      if (!email || !password) {
        showMessage("Please enter both email and password.");
        return;
      }

      if (!emailRegex.test(email)) {
        showMessage("Invalid email format.");
        return;
      }

      if (!passwordRegex.test(password)) {
        showMessage("Password must be at least 8 characters long and include at least one number.");
        return;
      }

      setLoadingState(true);

      try {
        const response = await axios.post("/api/auth/login", { email, password });

        if (response.data && response.data.apiKey) {
          localStorage.setItem("apiKey", response.data.apiKey);

        
          if (localStorage.getItem("cookieConsent") === "true") {
            try {
              await fetch("/api/user/consent", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({ consent: true }),
              });
            } catch (err) {
              console.warn("Failed to update consent on backend:", err);
            }
          }

          showMessage("Login successful! Redirecting...", "success");
          setTimeout(() => {
            window.location.href = "/pdf-generator-demo";
          }, 1000);
        } else {
          
          showMessage((response.data && response.data.error) || "Invalid email or password.");
        }
      } catch (error) {
        
        if (error && error.response) {
          
          if (error.response.status === 401 || error.response.status === 403) {
            showMessage("Invalid email or password.");
          } else if (error.response.data && error.response.data.error) {
            showMessage(`Error: ${error.response.data.error}`);
          } else {
            showMessage("Login failed. Please try again.");
          }
        } else if (error && error.request) {
          
          showMessage("No response from server. Please check your connection.");
        } else {
         
          showMessage("An unexpected error occurred. Please try again.");
        }
      } finally {
        setLoadingState(false);
      }
    });
  </script>


  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: linear-gradient(to right, #4338ca, #6b21a8, #be185d);
      padding: 80px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }
    h1 {
      color: #000000;
      margin-bottom: 30px;
      font-size: 24px;
      font-weight: bold;
    }
    label {
      text-align: left;
      display: block;
      font-weight: 600;
      margin: 12px 0 6px;
      font-size: 16px;
    }
    input {
      width: 100%;
      padding: 16px;
      margin-bottom: 20px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    input:focus {
      border-color: #5e60ce;
      outline: none;
    }
    button {
      background-color: #5e60ce;
      color: white;
      padding: 16px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    button:hover {
      background-color: #4b4dbf;
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .password-container {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .toggle-btn {
      position: static;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 0;
      line-height: 1;
    }
    .extra-links {
      margin-top: 12px;
      font-size: 16px;
      color: #000000;
    }
    .extra-links a {
      color: #000000;
      text-decoration: underline;
      margin: 0 4px;
      font-weight: bold;
    }
    .extra-links a:hover {
      color: #4b4dbf;
    }
    .result {
      margin-top: 20px;
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }
    .result.show {
      opacity: 1;
      display: block;
    }
    .result.error {
      background-color: rgba(255, 0, 0, 0.12);
      color: #fff;
      border: 1px solid #ff6b6b;
    }
    .result.success {
      background-color: rgba(0, 128, 0, 0.08);
      color: #e6ffe6;
      border: 1px solid #66bb6a;
    }
    .register-link {
      margin-top: 20px;
      font-size: 16px;
      color: #000000;
    }
    .register-link a {
      color: #000000;
      text-decoration: underline;
      cursor: pointer;
      font-weight: bold;
    }
    .register-link a:hover {
      color: #4b4dbf;
    }

    @media (max-width: 420px) {
      body {
        padding: 1rem;
        height: auto;
        align-items: flex-start;
        margin-top: 10%;
      }
      .container {
        padding: 1.5rem 1rem;
        border-radius: 6px;
        max-width: 100%;
        box-shadow: none;
        background: linear-gradient(to bottom, #4338ca, #6b21a8, #be185d);
      }
      h1 {
        font-size: 20px;
        margin-bottom: 1.25rem;
      }
      label {
        font-size: 14px;
        margin: 10px 0 5px;
      }
      input {
        padding: 0.9rem;
        font-size: 15px;
        width: 90%;
      }
      button[type="submit"] {
        padding: 0.7rem;
        font-size: 15px;
        margin-top: 1rem;
      }
      .register-link,
      .extra-links {
        font-size: 14px;
        text-align: center;
        margin-top: 1rem;
      }
      .result {
        font-size: 14px;
        margin-top: 1rem;
        text-align: center;
      }
    }
  </style>
</body>
</html>
