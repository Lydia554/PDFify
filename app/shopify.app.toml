# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e07548c088f572af4bbf103e4dee46bb"
name = "PDFify Pro"
application_url = "https://pdfify.pro/"
embedded = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhook/app-uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhook/order-created"

  # NOTE: GDPR webhooks (customers/redact, customers/data_request, shop/redact)
  # are implemented as handlers but cannot be declared in TOML as
  # Shopify deprecated these topics. Handlers are registered via API
  # during app installation in shopifyApiRoutes.js

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_locations,read_orders,read_products,read_themes"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://pdfify.pro/api/shopify/callback" ]

[pos]
embedded = false
