version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf-api
    ports:
      - "3002:3000"         
    env_file:
      - .env
    environment:
      PUPPETEER_SKIP_DOWNLOAD: true
    cap_add:
      - SYS_ADMIN
    depends_on:
      - mongo
      - python-service
  volumes:
  - ./app:/app
  - /app/node_modules


  mongo:
    image: mongo:5.0
    container_name: pdf-api-mongo
    volumes:
      - ./mongo-data:/data/db

  python-service:
    build:
      context: ./python-service
    image: pdf-api-python
    volumes:
      - ./python-service:/app
    restart: unless-stopped
   

volumes:
  mongo-data: