version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf-api
    ports:
      - "3002:3000"         
    env_file:
      - .env
    environment:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    cap_add:
      - SYS_ADMIN
    depends_on:
      - mongo
    networks:
      - pdf-api-network

  python-invoice-service:
    build:
      context: ./python-invoice-service
      dockerfile: Dockerfile
    image: python-invoice-service
    ports:
      - "8000:8000"
    command: uvicorn invoice_service:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./python-invoice-service:/app
    networks:
      - pdf-api-network
      
  mongo:
    image: mongo:5.0
    container_name: pdf-api-mongo
    networks:
      - pdf-api-network
    links:
      - java-pdf-service
    volumes:
      - mongo-data:/data/db
    networks:
      - pdf-api-network
   
volumes:
  mongo-data:

networks:
  pdf-api-network:
    driver: bridge