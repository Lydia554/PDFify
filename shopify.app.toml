# Learn more about configuring your app at https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration

client_id = "e07548c088f572af4bbf103e4dee46bb"
name = "PDFify Pro"
application_url = "https://pdfify.pro/"
embedded = true

[webhooks]
api_version = "2025-01"

# App-specific webhooks (non-mandatory)
[[webhooks]]
topics = ["orders/create"]
uri = "/webhook/order-created"

# NOTE: GDPR compliance webhooks (customers/data_request, customers/redact, shop/redact)
# are MANDATORY and must be configured in Shopify Partner Dashboard, NOT in this file.
# Go to: https://partners.shopify.com/145227133/apps/325530976257/webhooks

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration#access_scopes
scopes = "read_locations,read_orders,read_products,read_themes"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://pdfify.pro/api/shopify/callback" ]

[pos]
embedded = false
