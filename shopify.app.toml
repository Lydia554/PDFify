# Learn more about configuring your app at https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration

client_id = "e07548c088f572af4bbf103e4dee46bb"
name = "PDFify Pro"
application_url = "https://pdfify.pro/"
embedded = true

[webhooks]
api_version = "2025-01"

# App-specific webhooks (non-mandatory only)
[[webhooks]]
topics = ["orders/create"]
uri = "/webhook/order-created"

# NOTE: Mandatory GDPR compliance webhooks (customers/data_request, customers/redact, shop/redact)
# must be configured during App Store submission review process, NOT in this file.
# Your webhook endpoints are already implemented and working:
# - https://pdfify.pro/webhook/customers-data-request
# - https://pdfify.pro/webhook/customers-redact
# - https://pdfify.pro/webhook/shop-redact

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration#access_scopes
scopes = "read_locations,read_orders,read_products,read_themes"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://pdfify.pro/api/shopify/callback" ]

[pos]
embedded = false
