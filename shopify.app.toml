# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e07548c088f572af4bbf103e4dee46bb"
name = "PDFify Pro"
application_url = "https://pdfify.pro/"
embedded = true

[webhooks]
api_version = "2026-01"

# Standard webhooks
[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "/webhook/order-created"

# GDPR Compliance webhooks (MANDATORY for public apps)
[webhooks.privacy_compliance]
customer_data_request_url = "https://pdfify.pro/webhook/customers-data-request"
customer_deletion_url = "https://pdfify.pro/webhook/customers-redact"
shop_deletion_url = "https://pdfify.pro/webhook/shop-redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_locations,read_orders,read_products,read_themes"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://pdfify.pro/api/shopify/callback" ]

[pos]
embedded = false
